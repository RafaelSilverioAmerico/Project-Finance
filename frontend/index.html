<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Caixa - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-painel">
        <h2>Bem-vindo ao Meu Caixa!</h2>
        <p>Tenha o controle das suas finanças de forma simples, rápida e organizada.</p>
    </div>

    <div class="auth-formulario">
        <form id="form-login">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="senha" placeholder="Senha">
            <button type="submit">Entrar</button>
        </form>

        <button type="button" id="btn-alternar">Não tem conta? Cadastre-se</button>

        <form id="form-registro" style="display: none">
            <input type="text" name="nome" placeholder="Nome">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="senha" placeholder="Senha">
            <button type="submit">Cadastrar</button>
        </form>

        <div class="redes-sociais">
            <a href="https://github.com/RafaelSilverioAmerico" target="_blank">
                <i class="fab fa-github"></i>
            </a>

            <a href="https://www.linkedin.com/in/rafael-silverio-americo-b19037364/" target="_blank">
                <i class="fab fa-linkedin"></i>
            </a>

            <a href="https://www.instagram.com/SEU_USUARIO/" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
